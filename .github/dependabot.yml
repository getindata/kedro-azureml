version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      # Group Azure ML related dependencies
      azure-deps:
        patterns:
          - "azure-*"
          - "azureml-*"
          - "adlfs"
      # Group development dependencies
      dev-deps:
        patterns:
          - "pytest*"
          - "tox"
          - "pre-commit"
          - "coverage*"
      # Group data processing dependencies
      data-deps:
        patterns:
          - "pandas"
          - "numpy"
          - "pyarrow"

    ignore:
      # Ignore patch updates for stable core dependencies
      - dependency-name: "kedro"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "mlflow"
        update-types: [ "version-update:semver-patch" ]
      # Skip minor updates for development tools
      - dependency-name: "pytest*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
    open-pull-requests-limit: 1
    groups:
      # Group all GitHub Actions updates
      github-actions:
        patterns:
          - "*"
